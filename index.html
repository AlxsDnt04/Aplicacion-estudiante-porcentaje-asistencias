<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario Simple</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>

  <body class="p-4 bg-light">
    <!-- Header Section -->
    <div class="container">
      <h1 class="mb-4"><i class="bi bi-journal-text"></i> Cálculo de Asistencia</h1>
      <!-- Formulario para agregar datos del estudiante -->
      <form
        id="estudiante-form"
        class="mb-4 p-3 bg-white shadow-sm rounded border"
      >
        <div class="row g-3 mb-3">
          <div class="col-md-4 col-lg-3">
            <label for="nombre" class="form-label">
              <i class="bi bi-person"></i> Nombre
            </label>
            <input
              type="text"
              class="form-control"
              id="nombre"
              placeholder="Nombre"
              required
            />
          </div>
          <div class="col-md-4 col-lg-3">
            <label for="apellido" class="form-label">
              <i class="bi bi-person"></i> Apellido
            </label>
            <input
              type="text"
              class="form-control"
              id="apellido"
              placeholder="Apellido"
              required
            />
          </div>
          <!-- asignaturas con -->
          <div class="col-md-4 col-lg-3">
            <label for="asignatura" class="form-label">
              <i class="bi bi-book"></i> Asignatura
            </label>
            <select class="form-control" id="asignatura" required>
              <option value="" disabled selected>Seleccione una asignatura</option>
              <option value="programacion">PROGRAMACION</option>
              <option value="base de datos">BASE DE DATOS</option>
              <option value="fundamentos">FUNDAMENTOS</option>
              <option value="realidad social">REALIDAD SOCIAL</option>
              <option value="networking">NETWORKING</option>
            </select>
          </div>
          <!-- Créditos -->
          <div class="col-md-4 col-lg-3">
            <label for="creditos" class="form-label">
              <i class="bi bi-123"></i> Créditos
            </label>
            <input
              type="number"
              class="form-control"
              id="creditos"
              placeholder="Número de créditos"
              min="1"
              max="10"
              required
              oninput="this.value = Math.max(1, Math.min(10, this.value))"
            />
          </div>

          <!-- Faltas -->
          <div class="col-md-4 col-lg-3">
            <label for="faltas" class="form-label">
              <i class="bi bi-exclamation-circle"></i> Faltas
            </label>
            <input
              type="number"
              class="form-control"
              id="faltas"
              placeholder="Número de faltas"
              min="1"
              max="10"
              required
              oninput="this.value = Math.max(1, Math.min(10, this.value))"
            />
          </div>
        </div>
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-circle"></i> Enviar
        </button>
      </form>
    </div>

    
      <!-- tabla para los datos -->
      <h3 class="mb-4"><i class="bi bi-table"></i> Resultados</h3>
      <div class="container bg-white shadow-sm rounded">
      <table class="table table-bordered" id="tabla-estudiantes">
        <thead>
          <!-- iconos -->

          <tr>
            <th><i class="bi bi-person"></i> Nombre</th>
            <th><i class="bi bi-person"></i> Apellido</th>
            <th><i class="bi bi-book"></i> Asignatura</th>
            <th><i class="bi bi-percent"></i> Porcentaje de Asistencia</th>
            <th>
              <i class="bi bi-exclamation-circle"></i> Porcentaje de Insistencia
            </th>
          </tr>
        </thead>
        <tbody>
          <!-- Aquí se agregarán dinámicamente las filas con los datos del estudiante -->
        </tbody>
      </table>
    </div>

    <!-- script -->
    <script src="inventario.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
